[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "px915-traffic"
version = "0.1.0"
description = "Traffic flow modelling: LWR PDE and cellular automaton models"
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "netCDF4>=1.7",
    "PyQt5>=5.15",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "sphinx-fortran>=1.1",
    "sphinx-rtd-theme>=2.0",
]

[tool.setuptools]
packages = []
